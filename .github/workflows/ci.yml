name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Check syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Check the server loads
        run: timeout 5 node src/index.js || test $? -eq 124
